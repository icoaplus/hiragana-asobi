<script>
// 8-game integrated navigation (retains both original game engines)
(function(){
 const ids=['learn','quiz','match','pairs','trace','words','memory'];
 const home=document.getElementById('homeScreen'),puzzle=document.getElementById('puzzlePanel');
 const tabs=ids.map(k=>document.getElementById(k+'Tab'));
 function choose(name){
  if(name==='home'||name==='puzzle'){
    ids.forEach(id=>{document.getElementById(id).hidden=true;document.getElementById(id+'Tab').classList.remove('on')});
    home.hidden=name!=='home';puzzle.hidden=name!=='puzzle';
    document.getElementById('puzzleTab').classList.toggle('on',name==='puzzle');
  }else{
    home.hidden=true;puzzle.hidden=true;document.getElementById('puzzleTab').classList.remove('on');
    showPanel(name);
  }
 }
 // Every top navigation button uses the same entrance-aware router.
 for (const id of ids) {
   const tab=document.getElementById(id+'Tab');
   tab.onclick=()=>choose(id);
 }
 document.getElementById('homeTop').onclick=()=>choose('home');
 document.getElementById('homeReturn').onclick=()=>choose('home');
 document.getElementById('homeLetters').onclick=()=>document.getElementById('letterSettings').click();
 const homeVoiceButton=document.getElementById('homeVoice');
 const homeVoiceMenu=document.getElementById('homeVoiceMenu');
 const voiceSelect=document.getElementById('voiceChoice');
 function updateHomeVoiceMenu(){homeVoiceMenu.querySelectorAll('[data-voice]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.voice===voiceSelect.value)));}
 homeVoiceButton.setAttribute('aria-expanded','false');
 homeVoiceButton.setAttribute('aria-controls','homeVoiceMenu');
 homeVoiceButton.onclick=()=>{const opening=homeVoiceMenu.hidden;homeVoiceMenu.hidden=!opening;homeVoiceButton.setAttribute('aria-expanded',String(opening));if(opening)updateHomeVoiceMenu();};
 homeVoiceMenu.querySelectorAll('[data-voice]').forEach(button=>button.onclick=()=>{voiceSelect.value=button.dataset.voice;voiceSelect.dispatchEvent(new Event('change',{bubbles:true}));updateHomeVoiceMenu();homeVoiceMenu.hidden=true;homeVoiceButton.setAttribute('aria-expanded','false');});
 document.getElementById('closeHomeVoice').onclick=()=>{homeVoiceMenu.hidden=true;homeVoiceButton.setAttribute('aria-expanded','false');homeVoiceButton.focus();};
 document.getElementById('puzzleTab').onclick=()=>choose('puzzle');
 document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>choose(b.dataset.game));
 // Let the first screen always be the game-selection entrance
 choose('home');
 document.getElementById('quizSkip').onclick=()=>{if(document.getElementById('quizModeChooser').hidden && !document.getElementById('qStart').hidden){document.getElementById('qStart').click();return;}if(typeof newQuestion==='function'&&typeof quizImageMode!=='undefined'&&quizImageMode!==null)newQuestion();};
 const count=document.getElementById('wordCount'),level=document.getElementById('wordLevel');
 window.wordSessionCap=5;window.wordLevelSelection='easy';
 function setWordSettings(){window.wordSessionCap=count.value==='all'?Infinity:Number(count.value);window.wordLevelSelection=level.value;document.getElementById('wordLength').dispatchEvent(new Event('change'));}
 count.addEventListener('change',setWordSettings);level.addEventListener('change',setWordSettings);
 document.getElementById('wordSkip').onclick=()=>{if(!document.getElementById('wordStart').hidden){document.getElementById('wordStart').click();return;}if(typeof wordIndex!=='undefined'&&wordList.length){wordIndex=(wordIndex+1)%Math.min(wordList.length,window.wordSessionCap);startWord();}};
})();
</script>
